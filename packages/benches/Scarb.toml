[package]
name = "benches"
description = "Gas and step benchmarks for the glamx package (not published)"
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
fixed.workspace = true
glam.workspace = true
glamx.workspace = true

[dev-dependencies]
snforge_std.workspace = true
assert_macros.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true

[scripts]
test = "snforge test"

# One integration-test crate per bench file. snforge's cost per test grows with the size of the
# compiled test program, so unrelated modules must not share a single tests crate. Explicit
# `[[test]]` targets replace the formerly auto-detected `tests/lib.cairo` (deleted). `scripts/bench.py`
# fails when this list and `tests/bench_*.cairo` differ. `test-type = "integration"` gives each
# crate access to `benches::harness` / `benches::alt`.

[[test]]
name = "bench_eigen3"
source-path = "tests/bench_eigen3.cairo"
test-type = "integration"

[[test]]
name = "bench_pose2"
source-path = "tests/bench_pose2.cairo"
test-type = "integration"

[[test]]
name = "bench_pose3"
source-path = "tests/bench_pose3.cairo"
test-type = "integration"

[[test]]
name = "bench_rot2"
source-path = "tests/bench_rot2.cairo"
test-type = "integration"

[[test]]
name = "bench_rot3"
source-path = "tests/bench_rot3.cairo"
test-type = "integration"

[[test]]
name = "bench_sdp"
source-path = "tests/bench_sdp.cairo"
test-type = "integration"
