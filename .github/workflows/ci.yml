name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - run: scarb fmt --check --workspace
      - run: scarb lint --workspace --test --deny-warnings
      - run: python3 scripts/gas_tables.py --check
      - run: python3 scripts/panic_coverage.py --check
      - run: python3 scripts/gen_eigen3.py emit --check

  test:
    name: Test glamx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
      - run: scarb build -p glamx
      - name: Test
        run: snforge test -p glamx --fuzzer-runs 32 --fuzzer-seed 1
      - name: Type identity with the glam facade
        run: snforge test -p facade_check

  bench:
    name: Build, benches, gas snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
      - name: Check gas snapshots
        run: |
          set -o pipefail
          python3 scripts/bench.py check | tee gas_report.md
      - name: Check bytecode size
        run: |
          set -o pipefail
          python3 scripts/bytecode_size.py check | tee -a gas_report.md
      - name: Publish gas report
        if: always()
        run: cat gas_report.md >> "$GITHUB_STEP_SUMMARY"

  golden:
    name: Golden vectors up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            tools/refgen/target
          key: refgen-${{ runner.os }}-${{ hashFiles('tools/refgen/Cargo.lock') }}
      - name: Generator unit tests
        run: cargo test --locked --manifest-path tools/refgen/Cargo.toml
      - name: Check golden vectors
        run: cargo run --locked --manifest-path tools/refgen/Cargo.toml -- check

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - run: scarb doc --workspace --disable-remote-linking

  # Package granularity rule (PK-G): the published crates against the size gates (library lines,
  # cold-build time and memory an empty consumer adds), scripts/consumer_cost.py, configured by
  # consumer_cost.toml.
  consumer-cost:
    name: Consumer cost
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - name: Consumer cost script (self-test, no build)
        run: python3 scripts/consumer_cost.py --self-test
      - name: Measure the published crates (cold builds, one after the other, median of 3)
        run: |
          set -o pipefail
          status=0
          python3 scripts/consumer_cost.py --repeat 3 --modules --json consumer_cost.json | tee consumer_cost.md || status=$?
          { echo "### Consumer cost"; echo; cat consumer_cost.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: consumer-cost
          path: |
            consumer_cost.json
            consumer_cost.md
          if-no-files-found: warn
          retention-days: 30

  all-checks:
    name: All checks passed
    if: always()
    needs: [fmt-lint, test, bench, golden, docs, consumer-cost]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
