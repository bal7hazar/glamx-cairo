name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; every push to main gets a group of its
# own commit (GitHub keeps one pending run per group), so each main commit keeps its full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs a pull request needs, from its changed paths (never from a label). Pushes to main
  # run every job. A change of the toolchain row, or of a path that no row of the table names,
  # runs every job. Prose .md files trigger nothing, except the ones a script checks: README.md
  # and packages/glamx/README.md (generated gas regions, gas_tables.py).
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      fmt_lint: ${{ steps.flags.outputs.fmt_lint }}
      test: ${{ steps.flags.outputs.test }}
      bench: ${{ steps.flags.outputs.bench }}
      golden: ${{ steps.flags.outputs.golden }}
      docs: ${{ steps.flags.outputs.docs }}
      consumer_cost: ${{ steps.flags.outputs.consumer_cost }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: some
        if: github.event_name == 'pull_request'
        with:
          filters: |
            toolchain:
              - '.tool-versions'
              - 'Scarb.toml'
              - 'Scarb.lock'
              - '.github/workflows/**'
            scripts:
              - 'scripts/**'
            gas:
              - 'gas/**'
            checked_docs:
              - 'README.md'
              - 'packages/glamx/README.md'
            bench_scripts:
              - 'scripts/bench.py'
              - 'scripts/bytecode_size.py'
            golden_tests:
              - 'packages/glamx/tests/golden_*.cairo'
            doc_sources:
              - 'packages/*/src/**'
              - 'packages/*/Scarb.toml'
            consumer:
              - 'packages/glamx/src/**'
              - 'packages/glamx/Scarb.toml'
              - 'consumer_cost.toml'
              - 'scripts/consumer_cost.py'
              - 'scripts/packages_table.py'
      # Filters that exclude prose .md (or select what no row names) need every pattern of a list
      # to hold: with the default quantifier, a list of negations matches almost every path.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: every
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: 'every'
          filters: |
            cairo:
              - 'packages/**'
              - '!**/*.md'
            test_glamx:
              - 'packages/glamx/**'
              - '!**/*.md'
            test_facade:
              - 'packages/facade_check/**'
              - '!**/*.md'
            refgen:
              - 'tools/refgen/**'
              - '!**/*.md'
            unknown:
              - '**'
              - '!packages/**'
              - '!scripts/**'
              - '!gas/**'
              - '!tools/refgen/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!consumer_cost.toml'
              - '!.tool-versions'
              - '!Scarb.toml'
              - '!Scarb.lock'
              - '!.github/workflows/**'
      - name: Jobs to run
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          TOOLCHAIN: ${{ steps.some.outputs.toolchain }}
          SCRIPTS: ${{ steps.some.outputs.scripts }}
          GAS: ${{ steps.some.outputs.gas }}
          CHECKED_DOCS: ${{ steps.some.outputs.checked_docs }}
          BENCH_SCRIPTS: ${{ steps.some.outputs.bench_scripts }}
          GOLDEN_TESTS: ${{ steps.some.outputs.golden_tests }}
          DOC_SOURCES: ${{ steps.some.outputs.doc_sources }}
          CONSUMER: ${{ steps.some.outputs.consumer }}
          CAIRO: ${{ steps.every.outputs.cairo }}
          TEST_GLAMX: ${{ steps.every.outputs.test_glamx }}
          TEST_FACADE: ${{ steps.every.outputs.test_facade }}
          REFGEN: ${{ steps.every.outputs.refgen }}
          UNKNOWN: ${{ steps.every.outputs.unknown }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            for job in fmt_lint test bench golden docs consumer_cost; do
              echo "$job=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          # A filter output that is neither true nor false (a misspelt name) fails the job.
          for name in TOOLCHAIN SCRIPTS GAS CHECKED_DOCS BENCH_SCRIPTS GOLDEN_TESTS DOC_SOURCES CONSUMER CAIRO TEST_GLAMX TEST_FACADE REFGEN UNKNOWN; do
            if [[ "${!name}" != "true" && "${!name}" != "false" ]]; then
              echo "::error::filter output $name is '${!name}', expected true or false"
              exit 1
            fi
          done
          any() {
            for name in "$@"; do
              if [[ "${!name}" == "true" ]]; then echo true; return; fi
            done
            echo false
          }
          echo "fmt_lint=$(any TOOLCHAIN UNKNOWN CAIRO SCRIPTS GAS CHECKED_DOCS)" >> "$GITHUB_OUTPUT"
          echo "test=$(any TOOLCHAIN UNKNOWN TEST_GLAMX TEST_FACADE)" >> "$GITHUB_OUTPUT"
          echo "bench=$(any TOOLCHAIN UNKNOWN CAIRO GAS BENCH_SCRIPTS)" >> "$GITHUB_OUTPUT"
          echo "golden=$(any TOOLCHAIN UNKNOWN REFGEN GOLDEN_TESTS)" >> "$GITHUB_OUTPUT"
          echo "docs=$(any TOOLCHAIN UNKNOWN DOC_SOURCES)" >> "$GITHUB_OUTPUT"
          echo "consumer_cost=$(any TOOLCHAIN UNKNOWN CONSUMER)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  fmt-lint:
    name: Format and lint
    needs: changes
    if: ${{ needs.changes.outputs.fmt_lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb_1
        continue-on-error: true
      - run: sleep 20
        if: steps.scarb_1.outcome == 'failure'
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb_2
        if: steps.scarb_1.outcome == 'failure'
        continue-on-error: true
      - run: sleep 20
        if: steps.scarb_1.outcome == 'failure' && steps.scarb_2.outcome == 'failure'
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        if: steps.scarb_1.outcome == 'failure' && steps.scarb_2.outcome == 'failure'
      - run: scarb fmt --check --workspace
      - run: scarb lint --workspace --test --deny-warnings
      - run: python3 scripts/gas_tables.py --check
      - run: python3 scripts/panic_coverage.py --check
      - run: python3 scripts/gen_eigen3.py emit --check

  test:
    name: Test glamx
    needs: changes
    if: ${{ needs.changes.outputs.test == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb_1
        continue-on-error: true
      - run: sleep 20
        if: steps.scarb_1.outcome == 'failure'
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb_2
        if: steps.scarb_1.outcome == 'failure'
        continue-on-error: true
      - run: sleep 20
        if: steps.scarb_1.outcome == 'failure' && steps.scarb_2.outcome == 'failure'
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        if: steps.scarb_1.outcome == 'failure' && steps.scarb_2.outcome == 'failure'
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        id: snfoundry_1
        continue-on-error: true
      - run: sleep 20
        if: steps.snfoundry_1.outcome == 'failure'
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        id: snfoundry_2
        if: steps.snfoundry_1.outcome == 'failure'
        continue-on-error: true
      - run: sleep 20
        if: steps.snfoundry_1.outcome == 'failure' && steps.snfoundry_2.outcome == 'failure'
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        if: steps.snfoundry_1.outcome == 'failure' && steps.snfoundry_2.outcome == 'failure'
      - run: scarb build -p glamx
      - name: Test
        run: snforge test -p glamx --fuzzer-runs 32 --fuzzer-seed 1
      - name: Type identity with the glam facade
        run: snforge test -p facade_check

  bench:
    name: Build, benches, gas snapshots
    needs: changes
    if: ${{ needs.changes.outputs.bench == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb_1
        continue-on-error: true
      - run: sleep 20
        if: steps.scarb_1.outcome == 'failure'
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb_2
        if: steps.scarb_1.outcome == 'failure'
        continue-on-error: true
      - run: sleep 20
        if: steps.scarb_1.outcome == 'failure' && steps.scarb_2.outcome == 'failure'
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        if: steps.scarb_1.outcome == 'failure' && steps.scarb_2.outcome == 'failure'
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        id: snfoundry_1
        continue-on-error: true
      - run: sleep 20
        if: steps.snfoundry_1.outcome == 'failure'
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        id: snfoundry_2
        if: steps.snfoundry_1.outcome == 'failure'
        continue-on-error: true
      - run: sleep 20
        if: steps.snfoundry_1.outcome == 'failure' && steps.snfoundry_2.outcome == 'failure'
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        if: steps.snfoundry_1.outcome == 'failure' && steps.snfoundry_2.outcome == 'failure'
      - name: Check gas snapshots
        run: |
          set -o pipefail
          python3 scripts/bench.py check | tee gas_report.md
      - name: Check bytecode size
        run: |
          set -o pipefail
          python3 scripts/bytecode_size.py check | tee -a gas_report.md
      - name: Publish gas report
        if: always()
        run: cat gas_report.md >> "$GITHUB_STEP_SUMMARY"

  golden:
    name: Golden vectors up to date
    needs: changes
    if: ${{ needs.changes.outputs.golden == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            tools/refgen/target
          key: refgen-${{ runner.os }}-${{ hashFiles('tools/refgen/Cargo.lock') }}
      - name: Generator unit tests
        run: cargo test --locked --manifest-path tools/refgen/Cargo.toml
      - name: Check golden vectors
        run: cargo run --locked --manifest-path tools/refgen/Cargo.toml -- check

  docs:
    name: Docs build
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb_1
        continue-on-error: true
      - run: sleep 20
        if: steps.scarb_1.outcome == 'failure'
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb_2
        if: steps.scarb_1.outcome == 'failure'
        continue-on-error: true
      - run: sleep 20
        if: steps.scarb_1.outcome == 'failure' && steps.scarb_2.outcome == 'failure'
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        if: steps.scarb_1.outcome == 'failure' && steps.scarb_2.outcome == 'failure'
      - run: scarb doc --workspace --disable-remote-linking

  # Package granularity rule (PK-G): the published crates against the size gates (library lines,
  # cold-build time and memory an empty consumer adds), scripts/consumer_cost.py, configured by
  # consumer_cost.toml.
  consumer-cost:
    name: Consumer cost
    needs: changes
    if: ${{ needs.changes.outputs.consumer_cost == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb_1
        continue-on-error: true
      - run: sleep 20
        if: steps.scarb_1.outcome == 'failure'
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb_2
        if: steps.scarb_1.outcome == 'failure'
        continue-on-error: true
      - run: sleep 20
        if: steps.scarb_1.outcome == 'failure' && steps.scarb_2.outcome == 'failure'
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        if: steps.scarb_1.outcome == 'failure' && steps.scarb_2.outcome == 'failure'
      - name: Consumer cost script (self-test, no build)
        run: |
          python3 scripts/consumer_cost.py --self-test
          python3 scripts/packages_table.py --self-test
      - name: Measure the published crates (cold builds, one after the other, median of 3)
        run: |
          set -o pipefail
          status=0
          python3 scripts/consumer_cost.py --repeat 3 --modules --json consumer_cost.json | tee consumer_cost.md || status=$?
          { echo "### Consumer cost"; echo; cat consumer_cost.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Package table (docs/PACKAGES.md format, artifact and job summary)
        if: always() && hashFiles('consumer_cost.json') != ''
        run: |
          python3 scripts/packages_table.py consumer_cost.json \
            --runner "ubuntu-latest, $(nproc) vCPU / $(free -g | awk '/Mem:/ {print $2}') GB" \
            --output PACKAGES.md
          cat PACKAGES.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: consumer-cost
          path: |
            consumer_cost.json
            consumer_cost.md
            PACKAGES.md
          if-no-files-found: warn
          retention-days: 30

  all-checks:
    name: All checks passed
    if: always()
    needs: [changes, fmt-lint, test, bench, golden, docs, consumer-cost]
    runs-on: ubuntu-latest
    env:
      EVENT: ${{ github.event_name }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      FLAG_FMT_LINT: ${{ needs.changes.outputs.fmt_lint }}
      RESULT_FMT_LINT: ${{ needs.fmt-lint.result }}
      FLAG_TEST: ${{ needs.changes.outputs.test }}
      RESULT_TEST: ${{ needs.test.result }}
      FLAG_BENCH: ${{ needs.changes.outputs.bench }}
      RESULT_BENCH: ${{ needs.bench.result }}
      FLAG_GOLDEN: ${{ needs.changes.outputs.golden }}
      RESULT_GOLDEN: ${{ needs.golden.result }}
      FLAG_DOCS: ${{ needs.changes.outputs.docs }}
      RESULT_DOCS: ${{ needs.docs.result }}
      FLAG_CONSUMER_COST: ${{ needs.changes.outputs.consumer_cost }}
      RESULT_CONSUMER_COST: ${{ needs.consumer-cost.result }}
    steps:
      # A job passes when it succeeded, or when the paths rule skipped it. On a pull request its
      # result is compared with the flag that gates it: flag true needs success, flag false needs
      # skipped (a skip for another reason, such as a failed dependency, fails), any other flag
      # value (a misspelt output) fails. Elsewhere every job must have succeeded.
      - run: |
          fail=0
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::changes: $CHANGES_RESULT"
            fail=1
          fi
          check() {
            local job=$1 flag=$2 result=$3 want
            if [[ "$EVENT" != "pull_request" || "$flag" == "true" ]]; then
              want=success
            elif [[ "$flag" == "false" ]]; then
              want=skipped
            else
              echo "::error::$job: gate flag is '$flag', expected true or false"
              fail=1
              return
            fi
            if [[ "$result" != "$want" ]]; then
              echo "::error::$job: $result (flag '$flag', expected $want)"
              fail=1
            fi
          }
          check fmt-lint "$FLAG_FMT_LINT" "$RESULT_FMT_LINT"
          check test "$FLAG_TEST" "$RESULT_TEST"
          check bench "$FLAG_BENCH" "$RESULT_BENCH"
          check golden "$FLAG_GOLDEN" "$RESULT_GOLDEN"
          check docs "$FLAG_DOCS" "$RESULT_DOCS"
          check consumer-cost "$FLAG_CONSUMER_COST" "$RESULT_CONSUMER_COST"
          exit "$fail"
