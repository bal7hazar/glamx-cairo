[workspace]
members = ["packages/*"]

[workspace.package]
version = "0.5.0"
edition = "2024_07"
cairo-version = "2.20.0"
license = "MIT"
repository = "https://github.com/bal7hazar/glamx-cairo"

[workspace.dependencies]
fixed = "0.5.0"
glam = "0.5.0"
glam_core = "0.5.0"
glamx = { path = "packages/glamx", version = "0.5.0" }
snforge_std = "0.64.0"
assert_macros = "2.20.0"

[workspace.tool.fmt]
sort-module-level-items = true
max-line-length = 100

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
