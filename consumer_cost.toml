# Gates of scripts/consumer_cost.py (copied unchanged from nalgebra-cairo 7177cf3; see the docstring
# at the top of that script). The values are the defaults of the package granularity rule: a
# published crate has at most 40,000 library lines, and its MARGINAL cost (an empty consumer of it
# minus an empty consumer of its direct dependencies together) is at most 5 s / 1 GB; a typical
# closure adds at most 15 s / 3 GB to the no-dependency cold build.
[gates]
max_lines = 40000
max_seconds = 5
max_gb = 1
closure_seconds = 15
closure_gb = 3

# "Typical closure" of the product: the crates a consumer of `glamx` pulls in together, measured by
# one consumer that depends on all of them (gate 3: 15 s / 3 GB over the no-dependency build). A
# member is a workspace crate by name or a registry crate with its version requirement.
[closures]
glamx = ["glamx", "glam_core@0.5.0", "fixed@0.5.0"]
